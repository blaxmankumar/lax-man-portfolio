<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-labelledby="snake-mobile-title snake-mobile-desc">
  <title id="snake-mobile-title">Snake Game DevOps — repository-defined workflow</title>
  <desc id="snake-mobile-desc">Jenkins defines Terraform stages for AWS VPC and EC2 provisioning and a subsequent SSH deployment of Docker Compose on EC2. Compose defines NGINX, frontend and backend services. The dashed lane contains independent Kubernetes NGINX Ingress and Services configuration, not a Jenkins deployment stage. This diagram does not assert successful pipeline execution or a live deployment.</desc>
  <!-- Source: blaxmankumar/snake-game-app, main at 7691d78491ad8e4a7a27fe2e524d359e7b30b421.
       jenkinsfile; terraform/main.tf; terraform/modules/{vpc,ec2}/main.tf;
       docker-compose.yml; nginx.conf; k8s/ingress.yaml; k8s/{frontend,backend}-{deployment,service}.yaml.
       The Jenkinsfile clones upstream ketankakde/snake-game-application. Configuration is not execution evidence. -->
  <defs>
    <linearGradient id="snake-mobile-panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101b2c"/><stop offset="1" stop-color="#0a111e"/>
    </linearGradient>
    <radialGradient id="snake-mobile-ambient">
      <stop stop-color="#38d9f5" stop-opacity=".1"/><stop offset="1" stop-color="#38d9f5" stop-opacity="0"/>
    </radialGradient>
    <filter id="snake-mobile-shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="snake-mobile-cyan-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M1 .8L5 3L1 5.2" fill="none" stroke="#38d9f5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="snake-mobile-green-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M1 .8L5 3L1 5.2" fill="none" stroke="#63e6be" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf4ff}
      .title{font-size:20px;font-weight:600;letter-spacing:-.3px}
      .service{font-size:18px;font-weight:600}
      .body{font-size:17px;fill:#9baec6}
      .panel{fill:url(#snake-mobile-panel);stroke:#29435b;stroke-width:1.1}
      .cyan-line{fill:none;stroke:#38d9f5;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .green-line{fill:none;stroke:#63e6be;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="360" height="440" fill="#050910"/>
  <ellipse cx="180" cy="158" rx="240" ry="210" fill="url(#snake-mobile-ambient)"/>
  <text x="16" y="26" class="title">Jenkinsfile</text>
  <text x="344" y="26" class="body" text-anchor="end">Defined workflow</text>

  <path d="M96 85V97" class="cyan-line" marker-end="url(#snake-mobile-cyan-arrow)"/>
  <path d="M174 145H185" class="cyan-line" marker-end="url(#snake-mobile-cyan-arrow)"/>
  <path d="M265 187V200" class="cyan-line" marker-end="url(#snake-mobile-cyan-arrow)"/>
  <path d="M180 240V254" class="green-line" marker-end="url(#snake-mobile-green-arrow)"/>

  <g filter="url(#snake-mobile-shadow)">
    <rect x="16" y="43" width="328" height="42" rx="12" class="panel"/>
    <rect x="16" y="98" width="158" height="89" rx="12" class="panel"/>
    <rect x="186" y="98" width="158" height="89" rx="12" class="panel"/>
    <rect x="16" y="201" width="328" height="39" rx="12" class="panel"/>
    <rect x="16" y="255" width="328" height="89" rx="16" class="panel"/>
  </g>
  <path d="M29 44H331M29 99H161M199 99H331M29 256H331" stroke="#38d9f5" stroke-width="1" opacity=".5"/>
  <text x="32" y="70" class="title">Jenkins</text>
  <text x="328" y="70" class="body" text-anchor="end">SCM checkout</text>

  <text x="32" y="126" class="title">Terraform</text>
  <text x="32" y="153" class="body">init · validate</text>
  <text x="32" y="176" class="body">plan · apply</text>
  <text x="202" y="126" class="title">AWS VPC</text>
  <path d="M202 134H235" stroke="#f4a261" stroke-width="1.5" stroke-linecap="round"/>
  <text x="202" y="153" class="body">Public subnet</text>
  <text x="202" y="176" class="body">EC2 · public IP</text>

  <path d="M18 213V229" stroke="#63e6be" stroke-width="2" stroke-linecap="round"/>
  <text x="32" y="227" class="title">Jenkins: SSH deploy</text>

  <text x="32" y="284" class="title">Docker Compose on EC2</text>
  <path d="M32 296H328" stroke="#223a50" stroke-width="1"/>
  <text x="32" y="318" class="service">NGINX</text>
  <text x="32" y="339" class="body">proxy</text>
  <text x="135" y="318" class="service">frontend</text>
  <text x="135" y="339" class="body">UI</text>
  <text x="241" y="318" class="service">backend</text>
  <text x="241" y="339" class="body">API</text>

  <!-- No connector joins this independent configuration lane to the Jenkins workflow. -->
  <rect x="16" y="356" width="328" height="78" rx="12" fill="#09111d" stroke="#52647e" stroke-width="1.1" stroke-dasharray="4 5"/>
  <text x="32" y="381" class="service">Separate Kubernetes manifests</text>
  <text x="32" y="404" class="body">NGINX Ingress + Services</text>
  <text x="32" y="427" class="body">Not a Jenkins stage</text>
</svg>